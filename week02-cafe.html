<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T&M cafe</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-300">
    <header class="bg-blue-200 shadow px-9 py-9"><h1 class="text-red-600 text-5xl font-bold text-center">T&M cafe</h1>
    <p class="text-gray-600 text-sm mt-1 text-center">多摩センターコーヒーショップ</p>
    </header>
    <main class="max-w-2xl mx-auto p-6">
        <div class="bg-blue-200 shadow px-9 py-9 mb-4">
            <h2 class="text-3xl font-bold text-gray-800 mb-4 ">ドリンク</h2>
            <ul class="list-disc list-inside text-gray-700 text-2xl">
                <li>カフェラテ 450円</li>
                <li>アイスティー 400円</li>
                <li>ホットチョコレート 350円</li>
        </div>
        <div class="bg-blue-200 shadow px-9 py-9">
            <h2 class="text-3xl font-bold text-gray-800 mb-4">フード</h2>
            <ul class="list-disc list-inside text-gray-700 text-2xl">
                <li>クロワッサン 450円</li>
                <li>サンドイッチ 500円</li>
                <li>ショートケーキ 300円</li>
            </ul>
        </div>
        <button class="bg-blue-600 text-white px-4 py-2 rounded hover:bg-blue-700">
注文する
</button>

<a href="#" class="text-blue-600 underline hover:text-blue-800">
詳細を見る
</a>
    </main>
</body>
</html>
