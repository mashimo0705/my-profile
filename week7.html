<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>シンプルTODOリスト</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 16px;
    }

    h1 {
      font-size: 1.6rem;
      margin-bottom: 16px;
    }

    .todo-input-area {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .todo-input-area input[type="text"] {
      flex: 1;
      padding: 8px;
      font-size: 1rem;
    }

    .todo-input-area button {
      padding: 8px 12px;
      font-size: 0.9rem;
      cursor: pointer;
    }

    ul.todo-list {
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 0;
      border-bottom: 1px solid #ddd;
    }

    .todo-text {
      flex: 1;
      word-break: break-all;
    }

    .todo-text.completed {
      text-decoration: line-through;
      color: #777;
    }

    .todo-actions {
      display: flex;
      gap: 4px;
    }

    .todo-actions button {
      font-size: 0.8rem;
      padding: 4px 8px;
      cursor: pointer;
    }

    @media (max-width: 480px) {
      body {
        margin: 24px auto;
      }
      .todo-item {
        flex-direction: column;
        align-items: flex-start;
      }
      .todo-actions {
        align-self: flex-end;
      }
    }
  </style>
</head>
<body>
  <h1>シンプルTODOリスト</h1>

  <div class="todo-input-area">
    <input id="todo-input" type="text" placeholder="タスクを入力してください" />
    <button id="add-button">追加</button>
  </div>

  <ul id="todo-list" class="todo-list"></ul>

  <script>
    // 要素取得
    const todoInput = document.querySelector('#todo-input');
    const addButton = document.querySelector('#add-button');
    const todoList = document.querySelector('#todo-list');

    // 「追加」ボタンのクリックイベント
    addButton.addEventListener('click', () => {
      const text = todoInput.value.trim();

      // 空文字なら何もしない
      if (text === '') {
        return;
      }

      // li要素を作成
      const li = document.createElement('li');
      li.classList.add('todo-item');

      // テキスト部分
      const span = document.createElement('span');
      span.classList.add('todo-text');
      span.textContent = text;

      // ボタンをまとめるコンテナ
      const actions = document.createElement('div');
      actions.classList.add('todo-actions');

      // 完了ボタン
      const completeButton = document.createElement('button');
      completeButton.textContent = '完了';
      completeButton.addEventListener('click', () => {
        // completedクラスの付け外しで打ち消し線を制御
        span.classList.toggle('completed');
      });

      // 削除ボタン（発展）
      const deleteButton = document.createElement('button');
      deleteButton.textContent = '削除';
      deleteButton.addEventListener('click', () => {
        // 今回のUX: 簡潔さを優先して確認なしで即削除
        // （PR本文で理由を書く）
        todoList.removeChild(li);
      });

      actions.appendChild(completeButton);
      actions.appendChild(deleteButton);

      li.appendChild(span);
      li.appendChild(actions);

      // リストに追加
      todoList.appendChild(li);

      // 入力欄を空にする
      todoInput.value = '';
      todoInput.focus();
    });

    // Enterキーでも追加できるようにする（任意）
    todoInput.addEventListener('keydown', (event) => {
      if (event.key === 'Enter') {
        addButton.click();
      }
    });
  </script>
</body>
</html>
