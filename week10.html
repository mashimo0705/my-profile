<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <title>GitHubユーザー情報ツール</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 min-h-screen flex flex-col items-center p-6">

  <h1 class="text-3xl font-bold mb-6">GitHubユーザー情報表示ツール</h1>

  <div class="bg-white shadow-md rounded p-6 w-full max-w-md">
    <input
      id="usernameInput"
      type="text"
      placeholder="GitHubユーザー名を入力"
      class="w-full border p-2 rounded mb-4"
    />

    <button
      id="searchBtn"
      class="w-full bg-blue-600 text-white py-2 rounded hover:bg-blue-700"
    >
      検索
    </button>

    <p id="loading" class="text-gray-600 mt-4 hidden">読み込み中...</p>
    <p id="error" class="text-red-600 mt-4"></p>

    <div id="result" class="mt-6 hidden">
      <img id="avatar" class="w-24 h-24 rounded-full mx-auto mb-4" />
      <h2 id="name" class="text-xl font-bold text-center"></h2>
      <p id="bio" class="text-center text-gray-700 mt-2"></p>
      <p id="followers" class="text-center mt-2 font-medium"></p>
      <p id="repos" class="text-center mt-1 text-gray-700"></p>
      <a id="profileLink" class="text-blue-600 text-center block mt-2 underline" target="_blank">
        GitHubプロフィールを見る
      </a>
    </div>
  </div>

  <script>
    const input = document.getElementById("usernameInput");
    const btn = document.getElementById("searchBtn");
    const loading = document.getElementById("loading");
    const error = document.getElementById("error");
    const result = document.getElementById("result");

    btn.addEventListener("click", async () => {
      const username = input.value.trim();
      if (!username) return;

      result.classList.add("hidden");
      error.textContent = "";
      loading.classList.remove("hidden");

      try {
        const response = await fetch(`https://api.github.com/users/${username}`);
        console.log(response);

        if (!response.ok) {
          error.textContent = "ユーザーが見つかりませんでした";
          loading.classList.add("hidden");
          return;
        }

        const data = await response.json();
        console.log(data);

        document.getElementById("avatar").src = data.avatar_url;
        document.getElementById("name").textContent = data.name || "名前なし";
        document.getElementById("bio").textContent = data.bio || "自己紹介なし";
        document.getElementById("followers").textContent = `フォロワー: ${data.followers}`;
        document.getElementById("repos").textContent = `公開リポジトリ: ${data.public_repos}`;
        document.getElementById("profileLink").href = data.html_url;

        result.classList.remove("hidden");
      } catch (err) {
        console.error(err);
        error.textContent = "通信エラーが発生しました";
      } finally {
        loading.classList.add("hidden");
      }
    });
  </script>
</body>
</html>
