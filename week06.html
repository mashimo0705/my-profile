<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>BMI計算ツール</title>
<style>
  body { font-family: sans-serif; margin: 30px; }
  label { display: block; margin-top: 10px; }
  input { padding: 5px; width: 100px; }
  button { margin-top: 15px; padding: 8px 15px; }
  .result { margin-top: 20px; font-weight: bold; }
  .error { color: red; }
</style>
</head>
<body>

<h1>BMI計算ツール</h1>

<label>身長（cm）: <input type="number" id="height" step="0.1"></label>
<label>体重（kg）: <input type="number" id="weight" step="0.1"></label>
<button onclick="calculateBMI()">計算する</button>

<div id="message" class="result"></div>

<script>
function calculateBMI() {
  const heightCm = parseFloat(document.getElementById('height').value);
  const weightKg = parseFloat(document.getElementById('weight').value);
  const message = document.getElementById('message');

  // 入力チェック
  if (isNaN(heightCm) || isNaN(weightKg) || heightCm <= 0 || weightKg <= 0) {
    message.innerHTML = '<span class="error">正しい数値を入力してください。</span>';
    return;
  }

  // cm → m に変換
  const heightM = heightCm / 100;
  const bmi = weightKg / (heightM ** 2);

  // 判定
  let category = '';
  if (bmi < 18.5) {
    category = '痩せ型';
  } else if (bmi < 25) {
    category = '普通';
  } else {
    category = '肥満';
  }

  message.innerHTML = `あなたのBMIは <strong>${bmi.toFixed(1)}</strong> です（${category}）`;
}
</script>

</body>
</html>
