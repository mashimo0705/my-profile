<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>おみくじアプリ</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100 min-h-screen flex flex-col items-center justify-center p-4">

  <div class="bg-white shadow-lg rounded-xl p-6 w-full max-w-md text-center">
    <h1 class="text-2xl font-bold mb-4">🎉 ランダムおみくじ 🎉</h1>

    <!-- 結果表示 -->
    <div id="resultBox"
         class="text-3xl font-bold py-6 mb-6 border rounded-lg bg-gray-50 transition-all duration-300">
      ここに結果が出ます
    </div>

    <!-- ボタン -->
    <button id="btn"
            class="px-6 py-3 bg-blue-500 text-white rounded-lg hover:bg-blue-600 active:scale-95 transition">
      おみくじを引く
    </button>
  </div>

  <script>
    const btn = document.getElementById("btn");
    const resultBox = document.getElementById("resultBox");

    const results = [
      "大吉 ✨",
      "中吉 😊",
      "小吉 🙂",
      "吉 👍",
      "末吉 🤔",
      "凶 😢",
      "大凶 💀"
    ];

    btn.addEventListener("click", () => {
      // ランダムに結果を選ぶ
      const randomIndex = Math.floor(Math.random() * results.length);
      const result = results[randomIndex];

      // アニメーション（少し縮んで戻る）
      resultBox.classList.add("scale-75");
      setTimeout(() => {
        resultBox.textContent = result;
        resultBox.classList.remove("scale-75");
        resultBox.classList.add("scale-100");
      }, 150);
    });
  </script>

</body>
</html>
