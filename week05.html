<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>未来をつなぐNPO</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-gray-100">

  <!-- ヘッダー -->
  <header class="bg-green-600 text-white p-5">
    <div class="max-w-6xl mx-auto flex flex-col md:flex-row justify-between items-center">
      <h1 class="text-3xl font-bold mb-4 md:mb-0">
        未来をつなぐNPO
      </h1>

      <nav>
        <ul class="flex flex-col md:flex-row gap-4 text-center">
          <li><a href="#" class="hover:underline">ホーム</a></li>
          <li><a href="#" class="hover:underline">活動内容</a></li>
          <li><a href="#" class="hover:underline">イベント</a></li>
          <li><a href="#" class="hover:underline">お問い合わせ</a></li>
        </ul>
      </nav>
    </div>
  </header>

  <!-- メイン -->
  <main class="max-w-6xl mx-auto p-6">

    <!-- ヒーロー -->
    <section class="text-center mb-10">
      <h2 class="text-4xl font-bold mb-4">
        地域と未来をつなぐ活動
      </h2>

      <p class="text-gray-700">
        私たちは地域の子どもや高齢者を支援し、
        誰もが安心して暮らせる社会を目指しています。
      </p>
    </section>

    <!-- カード -->
    <section class="grid grid-cols-1 md:grid-cols-3 gap-6">

      <div class="bg-white rounded-lg shadow p-5">
        <h3 class="text-xl font-bold mb-3">
          子ども支援
        </h3>

        <p class="text-gray-600">
          学習支援や居場所づくりを通して、
          子どもたちの成長を応援しています。
        </p>
      </div>

      <div class="bg-white rounded-lg shadow p-5">
        <h3 class="text-xl font-bold mb-3">
          環境保全
        </h3>

        <p class="text-gray-600">
          地域清掃や植樹活動を行い、
          美しい自然を未来へ残します。
        </p>
      </div>

      <div class="bg-white rounded-lg shadow p-5">
        <h3 class="text-xl font-bold mb-3">
          ボランティア募集
        </h3>

        <p class="text-gray-600">
          一緒に活動してくださる仲間を募集しています。
          初めての方も大歓迎です。
        </p>
      </div>

    </section>

  </main>

  <!-- フッター -->
  <footer class="bg-gray-800 text-white text-center p-5 mt-10">
    <p>© 2026 未来をつなぐNPO All Rights Reserved.</p>
  </footer>

</body>
</html>
